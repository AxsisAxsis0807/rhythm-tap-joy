name: Pulse Lane settings regression
on:
  push:
    branches:
      - fix/pulse-lane-settings-audit-20261115
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, tests, build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - id: typecheck
        name: TypeScript
        continue-on-error: true
        run: bun run typecheck
      - id: tests
        name: Vitest
        continue-on-error: true
        run: bun run test
      - id: build
        name: Production build
        continue-on-error: true
        run: bun run build
      - id: lint
        name: ESLint
        continue-on-error: true
        run: bun run lint
      - name: Require all checks to pass
        if: ${{ always() }}
        run: |
          test "${{ steps.typecheck.outcome }}" = "success"
          test "${{ steps.tests.outcome }}" = "success"
          test "${{ steps.build.outcome }}" = "success"
          test "${{ steps.lint.outcome }}" = "success"
