name: Pulse Lane Roblox build

on:
  push:
    paths:
      - 'roblox/**'
      - '.github/workflows/pulse-lane-roblox-*.yml'
  pull_request:
    paths:
      - 'roblox/**'
      - '.github/workflows/pulse-lane-roblox-*.yml'
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check workflows and Luau, then build the place
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash roblox/ci/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pulse-lane-roblox-${{ github.sha }}
          path: roblox/PulseLane.rbxlx
          if-no-files-found: error
          retention-days: 7
